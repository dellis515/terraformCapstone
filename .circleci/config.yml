version: 2.1

orbs:
  terraform: circleci/terraform@3.4.0

executors:
  terraform-executor:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project

jobs:
  terraform-validate:
    executor: terraform-executor
    steps:
      - checkout
      - run:
          name: Install Terraform
          command: |
            sudo apt-get update
            sudo apt-get install -y unzip curl
            curl -fsSL https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip -o terraform.zip
            unzip terraform.zip
            sudo mv terraform /usr/local/bin/
      - run:
          name: Terraform Init & Validate
          command: |
            cd terraform
            terraform init
            terraform validate

  terraform-plan:
    executor: terraform-executor
    steps:
      - checkout
      - run:
          name: Install Terraform
          command: |
            sudo apt-get update
            sudo apt-get install -y unzip curl
            curl -fsSL https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip -o terraform.zip
            unzip terraform.zip
            sudo mv terraform /usr/local/bin/
      - run:
          name: Terraform Plan
          command: |
            cd terraform
            terraform init
            terraform plan \
              -var "admin_username=labadmin" \
              -var "admin_password=$LAB_ADMIN_PASSWORD"

  terraform-apply:
    executor: terraform-executor
    steps:
      - checkout
      - run:
          name: Install Terraform
          command: |
            sudo apt-get update
            sudo apt-get install -y unzip curl
            curl -fsSL https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip -o terraform.zip
            unzip terraform.zip
            sudo mv terraform /usr/local/bin/
      - run:
          name: Terraform Apply
          command: |
            cd terraform
            terraform init
            terraform apply -auto-approve \
              -var "admin_username=labadmin" \
              -var "admin_password=$LAB_ADMIN_PASSWORD"

  terraform-destroy:
    executor: terraform-executor
    steps:
      - checkout
      - run:
          name: Install Terraform
          command: |
            sudo apt-get update
            sudo apt-get install -y unzip curl
            curl -fsSL https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip -o terraform.zip
            unzip terraform.zip
            sudo mv terraform /usr/local/bin/
      - run:
          name: Terraform Destroy
          command: |
            cd terraform
            terraform init
            terraform destroy -auto-approve \
              -var "admin_username=labadmin" \
              -var "admin_password=$LAB_ADMIN_PASSWORD"

workflows:
  terraform:
    jobs:
      - terraform-validate
      - terraform-plan:
          requires:
            - terraform-validate
      - terraform-apply:
          requires:
            - terraform-plan
          filters:
            branches:
              only: main
      - hold-destroy:
          type: approval
          requires:
            - terraform-apply
      - terraform-destroy:
          requires:
            - hold-destroy
